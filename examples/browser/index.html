<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>almide-wasm-bindgen browser demo</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 2em; }
    pre { background: #f4f4f4; padding: 1em; border-radius: 4px; }
    .ok { color: #0a0; }
    .err { color: #c00; }
  </style>
</head>
<body>
  <h1>almide-wasm-bindgen — browser demo</h1>
  <p>Open the browser devtools console to see output.</p>
  <pre id="log"></pre>
  <script type="module">
    import init, { greet, add, scale, is_positive } from './hello.js';

    const log = (msg, cls = '') => {
      const el = document.getElementById('log');
      const line = document.createElement('div');
      if (cls) line.className = cls;
      line.textContent = msg;
      el.appendChild(line);
      console.log(msg);
    };

    try {
      await init();
      log('✓ init() succeeded', 'ok');
      log(`greet("world") = ${greet('world')}`);
      log(`greet("日本語") = ${greet('日本語')}`);
      log(`add(3, 4) = ${add(3, 4)}`);
      log(`scale(2.5) = ${scale(2.5)}`);
      log(`is_positive(-5) = ${is_positive(-5)}`);
      log(`is_positive(7) = ${is_positive(7)}`);
    } catch (e) {
      log(`✗ failed: ${e.message}`, 'err');
    }
  </script>
</body>
</html>
